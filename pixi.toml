[project]
name = "swarmmojo-native"
version = "0.1.0"
description = "Optional native components for the Swarmojo agent harness"
authors = ["Buzburg LLC <contact@buzburg.com>"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.1.0"
python = ">=3.11,<3.13"

[pypi-dependencies]
torch = { version = "==2.14.1+cpu", index = "https://download.pytorch.org/whl/cpu" }
onnxruntime = ">=1.22,<2"
transformers = ">=4.56"
huggingface-hub = ">=0.34"
pypdf = ">=6.21.1"
pillow = ">=13"
python-docx = ">=1.2"
python-pptx = ">=1.0.2"
openpyxl = ">=3.1.5"
sqlite-vec = ">=0.1.3"
fastmcp = ">=4.1,<5"
cryptography = ">=43"
python-frontmatter = ">=1.1.0"
pydantic = ">=2.0.0"
psutil = ">=5.9.0"
numpy = "*"

[tasks]
build-search = "python scripts/build_search_native.py"
build-broker = "mojo build app_mojo/omarchy_broker.mojo -o .pixi/envs/default/bin/omarchy-broker"
test-broker = "env OMARCHY_BROKER_BINARY=.pixi/envs/default/bin/omarchy-broker python -m unittest discover -s tests -p test_omarchy_broker.py -v"
broker = ".pixi/envs/default/bin/omarchy-broker"
build-sandbox = "mojo build app_mojo/staging_sandbox.mojo -o .pixi/envs/default/bin/staging-sandbox"
test-sandbox = "env OMARCHY_SANDBOX_BINARY=.pixi/envs/default/bin/staging-sandbox python -m pytest tests/test_native_sandbox.py -q"
build-rwkv = "mojo build app_mojo/rwkv_engine.mojo -o .pixi/envs/default/bin/rwkv-engine"
verify-all = "python scripts/verify_all.py"
bench-context = "env PYTHONPATH=. mojo -I . benchmarks/bench_context.mojo"
test = "env PYTHONPATH=. mojo -I . app_mojo/test_roms.mojo"
server = "env PYTHONPATH=. mojo -I . app_mojo/main.mojo"


