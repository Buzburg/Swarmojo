.search-label {
  display: flex;
  min-width: 150px;
  width: 210px;
  flex-shrink: 0;
}
.search-input {
  font-size: 10px;
  width: 100%;
  background: #fafbf8;
  border: 1px solid #e2e6dc;
  border-radius: 5px;
  padding: 7px 10px;
  color: var(--ink);
}
.search-input::placeholder {
  color: #5e6d61;
}
.result-table-area {
  border: 1px solid var(--line);
  border-top: 0;
  background: #fff;
  border-radius: 0 0 7px 7px;
}
.table-scroll {
  overflow-x: auto;
  width: 100%;
}
.results-table {
  border-collapse: collapse;
  text-align: left;
  width: 100%;
  table-layout: fixed;
  min-width: 720px;
}
.results-table th {
  background: #f6f8f2;
  border-top: 1px solid #e4e8df;
  border-bottom: 1px solid #e4e8df;
  color: #5e6d61;
  font-size: 9px;
  letter-spacing: .35px;
  font-weight: 550;
  padding: 11px 16px;
  text-transform: uppercase;
}
.results-table th:first-child {
  width: 126px;
}
.results-table th:nth-child(2) {
  width: 22%;
}
.results-table th:nth-child(3) {
  width: auto;
}
.results-table th:nth-child(4) {
  width: 115px;
}
.results-table th:last-child {
  width: 95px;
}
.results-table td {
  padding: 12px 16px;
  border-bottom: 1px solid #edf0e8;
  font-size: 11px;
  vertical-align: middle;
}
.record-row:hover {
  background: #fafbf7;
}
.status-badge {
  font-size: 9px;
  padding: 3px 7px;
  border-radius: 4px;
  white-space: nowrap;
  background: #edf1f5;
  color: #5b6d81;
  display: inline-block;
  font-weight: 550;
}
.status-added {
  background: #e8f4eb;
  color: #306d47;
}
.status-removed {
  background: #f9ece8;
  color: #95513e;
}
.status-conflict {
  background: #fbf1da;
  color: #806015;
}
.status-unchanged {
  background: #f0f3eb;
  color: #5e6e54;
}
.record-key > span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.record-key > span:first-child {
  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  font-size: 11px;
  color: #485c4e;
}
.record-subtitle {
  font-size: 10px;
  color: #5e6d61;
  margin-top: 2px;
}
.change-description {
  color: #5e6d61;
  overflow-wrap: anywhere;
  line-height: 1.6;
}
.source-lines {
  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  color: #5e6d61;
  font-size: 9px !important;
}
.source-lines span {
  display: block;
}
.inspect-button {
  border: 0;
  border-radius: 3px;
  background: none;
  color: #52755e;
  font-size: 10px;
  white-space: nowrap;
  padding: 4px 0;
}
.inspect-button:hover {
  text-decoration: underline;
}
.results-table .record-details-cell {
  padding: 18px 22px;
  background: #f7f9f3;
  border-bottom: 1px solid #dfe7d8;
}
.review-explanation {
  color: #806126;
  max-width: 800px;
  font-size: 11px;
  margin-bottom: 14px;
}
.cell-changes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 13px;
  margin-bottom: 14px;
}
.cell-change > strong {
  display: block;
  color: #617160;
  font-size: 10px;
  margin-bottom: 6px;
}
.change-values {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid #dfe7d8;
}
.old-value,
.new-value {
  padding: 9px 10px;
  background: #fff8f4;
  min-width: 0;
}
.new-value {
  background: #eef7ed;
}
.value-label {
  font-size: 8px;
  color: #5e6d61;
  letter-spacing: .6px;
}
.change-values pre,
.original-fields pre {
  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 11px;
  margin: 4px 0 0;
  line-height: 1.65;
}
.old-value pre {
  color: #9b6652;
}
.new-value pre {
  color: #3f7854;
}
.original-records summary {
  font-size: 10px;
  color: #5e6d61;
  cursor: pointer;
}
.original-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 13px;
}
.original-side {
  min-width: 0;
}
.original-side h4 {
  font-size: 11px;
  font-weight: 550;
  margin-bottom: 8px;
  color: #566b54;
}
.original-record {
  border: 1px solid #e1e7dc;
  border-radius: 5px;
  background: #fff;
  margin-bottom: 10px;
  overflow: hidden;
}
.source-line-label {
  font-size: 9px;
  color: #5e6d61;
  border-bottom: 1px solid #e8ede2;
  padding: 7px 11px;
  background: #fafcf6;
}
.original-fields {
  margin: 0;
  display: grid;
  grid-template-columns: minmax(90px, 35%) minmax(0, 1fr);
  font-size: 10px;
}
.original-fields dt,
.original-fields dd {
  margin: 0;
  padding: 7px 10px;
  border-bottom: 1px solid #f0f3eb;
  overflow-wrap: anywhere;
  min-width: 0;
}
.original-fields dt {
  color: #5e6d61;
  font-size: 10px;
  background: #fdfefb;
}
.original-fields dd {
  color: #485e45;
}
.original-fields pre {
  margin: 0;
  font-size: 10px;
}
.original-fields .excluded-field {
  color: #5e6d61;
}
.field-note {
  font-size: 9px;
}
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 15px;
}
.pagination > .small,
.pager > .small {
  font-size: 10px;
}
.pager {
  display: flex;
  align-items: center;
  gap: 13px;
}
.pager .button {
  font-size: 10px;
  padding: 5px;
}
.no-results {
  text-align: center;
  color: #5e6d61;
  padding: 35px 20px;
  font-size: 12px;
  border-top: 1px solid #e7ecdf;
}
.evidence-details {
  margin-top: 14px;
  color: #5e6d61;
}
.evidence-details summary {
  font-size: 10px;
  cursor: pointer;
  width: fit-content;
}
.evidence-body {
  padding: 15px 18px;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.evidence-body .small {
  font-size: 10px;
}
.fingerprint {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.fingerprint code {
  font-size: 10px;
  color: #5e6d61;
  overflow-wrap: anywhere;
}
.stale-warning {
  border: 1px solid #e2ce9c;
  border-radius: 6px;
  background: #fff8e6;
  color: #89702c;
  padding: 12px 15px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 11px;
}
.site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  color: #5e6d61;
  border-top: 1px solid var(--line);
  margin-top: 34px;
  padding: 20px 0 28px;
  font-size: 10px;
}
.site-footer > span:first-child {
  color: #5e6d61;
}
.site-footer > span:last-child {
  text-align: right;
}
@keyframes fade {
  from {
    opacity: .4;
  }
  to {
    opacity: 1;
  }
}
