[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Swarmojo"
version = "1.0.0"
description = "Build with your own AI team. A local-first workspace for projects, specialist agents, ROMS memory, and human-reviewed actions. Your models, your control."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Buzburg AI", email = "buzburgai@gmail.com" }
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "fastmcp>=4.1,<5",
    "python-frontmatter>=1.1.0",
    "sqlite-vec>=0.1.3",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "numpy",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jinja2>=3.1.0",
    "cloudpickle>=3.1.0",
    "cryptography>=43"
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.22,<2", "transformers>=4.56", "huggingface-hub>=0.34", "torch>=2.5",
    "pypdf>=6.21.1", "pillow>=13", "python-docx>=1.2", "python-pptx>=1.0.2", "openpyxl>=3.1.5"
]
test = [
    "pytest>=8.0.0"
]

[project.scripts]
swarm-tangle = "swarmmojo:main"
swarmtangle = "swarmmojo:main"
swarmmojo = "swarmmojo:main"
swarmojo-desktop = "app.desktop:main"
swarm-mojo = "aeon.cli:main"
aeon = "aeon.cli:main"
polyharness = "app.polyharness:main"

[tool.setuptools]
py-modules = ["swarmmojo", "roms", "cortex"]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["app*", "aeon*", "swarm_mojo*"]

[tool.setuptools.package-data]
aeon = [
    "defaults.toml",
    "assistant.html",
    "vendor/triggertangle/*.mjs",
    "vendor/triggertangle/LICENSE",
    "vendor/triggertangle/PROVENANCE.json"
]
app = [
    "workbench/*",
    "desktop_assets/*",
    "knowledge_ui.html",
    "desktop_assets/utilities/*"
]

# The knowledge encoder runs on CPU; avoid pulling a CUDA runtime through uv.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
