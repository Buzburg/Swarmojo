<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13110e">
  <meta name="description" content="Your local Swarmojo workspace. Build projects, assemble specialist agents, and talk with your Main agent.">
  <title>Swarmojo — Your workspace</title>
  <link rel="stylesheet" href="desktop.css">
  <script type="module" src="desktop.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to workspace</a>
  <div class="desktop-shell">
    <header class="system-bar">
      <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 9v14l-12 7L4 23V9Z"/><path d="m10 12 6 4 6-4M16 16v8M10 7l6 4 6-4"/></svg><strong>SWARMOJO <span>HUD</span></strong><span class="system-tag">SOVEREIGN WORKSPACE</span></div>
      <div class="system-actions"><span class="local-indicator"><i></i> LOCAL FIRST</span><span id="clock"></span><button class="icon-button" data-action="quick-open" aria-label="Quick navigation" title="Quick navigation (Ctrl+K / ⌘K)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 15l6 6M17 9A7 7 0 1 1 3 9a7 7 0 0 1 14 0"/></svg></button><button class="header-settings" data-action="configure" title="Workspace settings (Ctrl+, or ⌘+,)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg>Settings</button><button class="icon-button mobile-menu" data-action="menu" aria-label="Toggle sidebar">☰</button></div>
    </header>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Workspace navigation"></aside>
      <main class="content" id="content" tabindex="-1"><div class="loading">Opening your workspace…</div></main>
    </div>
    <footer class="system-footer"><span><i></i> YOUR WORKSPACE. YOUR MODELS. YOUR CONTROL.</span><span id="footer-status">Connecting to local workspace</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
